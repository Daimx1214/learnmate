<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="LearnMate — a Class 8 Science tutor in English and Hindi. Offline, free, works on low internet.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F3A5F">
<title>LearnMate — Class 8 Science Tutor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"><p class="loading-note">लोड हो रहा है…</p></main>
<nav id="top-nav" class="top-nav" hidden></nav>
<script type="module" src="js/app.js"></script>
<script>
if('serviceWorker' in navigator){
  var hadController=!!navigator.serviceWorker.controller;
  var reloadKey='saathi-sw-reloaded';
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadController)return;
    if(sessionStorage.getItem(reloadKey)==='1')return;
    sessionStorage.setItem(reloadKey,'1');
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').then(function(reg){reg.update();}).catch(function(){});
}
</script>
</body>
</html>
